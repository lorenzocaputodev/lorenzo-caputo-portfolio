    <!--app-head-->
    <script>
      // Runs before first paint: enables the scroll-reveal styles (content stays visible without JS)
      // and sends visitors who explicitly chose English back to /en/. Storage key: src/utils/language.js.
      document.documentElement.classList.add('js')
      try {
        if (location.pathname === '/' && localStorage.getItem('portfolio-language') === 'en') {
          location.replace('/en/' + location.hash)
        }
      } catch (error) {
        // Storage unavailable: stay on the default language.
      }
    </script>
