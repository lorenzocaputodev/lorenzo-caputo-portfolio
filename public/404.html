<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina non trovata · Page not found — Lorenzo Caputo</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b1016" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
        background: radial-gradient(ellipse 75% 55% at 8% 12%, rgba(127, 153, 181, 0.15), transparent 55%), #090e14;
        color: #edf2f7;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      p {
        margin: 0;
      }

      .code {
        color: rgba(47, 211, 233, 0.82);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.22em;
      }

      h1 {
        margin: 0.8rem 0;
        font-size: clamp(1.8rem, 6vw, 2.6rem);
        letter-spacing: -0.03em;
      }

      .copy {
        color: #b1bed0;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.8rem;
        margin-top: 1.6rem;
      }

      .copy + .copy {
        margin-top: 0.4rem;
      }

      a {
        display: inline-block;
        padding: 0.85rem 1.3rem;
        border: 1px solid rgba(47, 211, 233, 0.34);
        border-radius: 999px;
        background: rgba(47, 211, 233, 0.13);
        color: #e5fdff;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: rgba(47, 211, 233, 0.2);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Pagina non trovata <span lang="en">· Page not found</span></h1>
      <p class="copy">La pagina che cerchi non esiste o è stata spostata.</p>
      <p class="copy" lang="en">The page you are looking for doesn't exist or has been moved.</p>
      <div class="actions">
        <a href="/">Torna al portfolio</a>
        <a href="/en/" lang="en">Back to the portfolio</a>
      </div>
    </main>
  </body>
</html>
